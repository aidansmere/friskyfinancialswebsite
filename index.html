<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frisky Financials</title>
<meta name="description" content="Real finance. Real people. Real talk.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0D1221;
  --bg2:     #111827;
  --gold:    #C9A84C;
  --gold-lt: #E2C47A;
  --gold-dk: #A07830;
  --muted:   #6B7A99;
  --faint:   #1E2A40;
  --discord: #5865F2;
}
html, body { height: 100%; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--gold-lt);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}

/* subtle radial glow behind content */
body::before {
  content: '';
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.wrap {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative; z-index: 1;
}

/* LOGO */
.logo {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 4rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* HEADLINE */
h1 {
  font-family: 'Syne', sans-serif;
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.08;
  color: var(--gold-lt);
  margin-bottom: 1.25rem;
  background: linear-gradient(160deg, #E8D08A 0%, #C9A84C 50%, #A07830 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* SUB */
.sub {
  font-size: 15px;
  font-weight: 300;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 2.75rem;
  max-width: 320px;
}

/* BUTTONS */
.btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 15px 20px;
  border-radius: 11px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  transition: opacity 0.18s, transform 0.18s, box-shadow 0.18s;
  width: 100%;
  letter-spacing: 0.01em;
}
.btn:hover { opacity: 0.9; transform: translateY(-1px); }
.btn:active { transform: translateY(0); opacity: 1; }

.btn-yt {
  background: linear-gradient(135deg, #C9A84C 0%, #A07830 100%);
  color: #0D1221;
  font-weight: 600;
  box-shadow: 0 4px 20px rgba(201,168,76,0.2);
}
.btn-yt:hover { box-shadow: 0 6px 28px rgba(201,168,76,0.35); }

.btn-discord {
  background: transparent;
  color: var(--gold);
  border: 1px solid rgba(201,168,76,0.3);
}
.btn-discord:hover { border-color: rgba(201,168,76,0.6); background: rgba(201,168,76,0.05); }

/* OR */
.or {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  color: var(--faint);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 2px 0;
}
.or::before, .or::after {
  content: ''; flex: 1; height: 1px;
  background: var(--faint);
}

/* NOTE */
.note {
  margin-top: 3.5rem;
  font-size: 10px;
  color: rgba(201,168,76,0.2);
  letter-spacing: 0.1em;
  font-weight: 400;
  text-transform: uppercase;
}

/* CUSTOM CURSOR */
.cursor {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(201, 168, 76, 0.35);
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.08s ease-out, opacity 0.2s;
}
html, body { cursor: none; }
a, button, .btn { cursor: none; }

@media (max-width: 420px) {
  h1 { font-size: 32px; }
  body { padding: 1.5rem; }
  .logo { margin-bottom: 3rem; }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <svg width="18" height="14" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0; display:block; margin-left: 5px;">
      <rect x="5"  y="13"   width="2.5" height="6"  rx="1.25" fill="#C9A84C"/>
      <rect x="9"  y="10"   width="2.5" height="12" rx="1.25" fill="#C9A84C"/>
      <rect x="13" y="7"    width="2.5" height="18" rx="1.25" fill="#E2C47A"/>
      <rect x="17" y="10.5" width="2.5" height="11" rx="1.25" fill="#C9A84C"/>
      <rect x="21" y="8"    width="2.5" height="16" rx="1.25" fill="#E2C47A"/>
      <rect x="25" y="12"   width="2.5" height="8"  rx="1.25" fill="#C9A84C"/>
    </svg>
    Frisky Financials
  </div>

  <h1>Real finance.<br>Real people.</h1>

  <p class="sub">
    A talk show about people's real lives and experiences with money — the good, the bad, and everything in between.
  </p>

  <div class="btns">
    <a href="https://www.youtube.com/channel/UCN7R9PfgXUqStTpmhvL6qGw" target="_blank" rel="noopener" class="btn btn-yt">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <path d="M15.68 1.88C15.5 1.19 14.96 0.65 14.27 0.47 13.02 0.13 8 0.13 8 0.13S2.98 0.13 1.73 0.47C1.04 0.65 0.5 1.19 0.32 1.88 0 3.14 0 5.77 0 5.77S0 8.4 0.32 9.66C0.5 10.35 1.04 10.86 1.73 11.04 2.98 11.38 8 11.38 8 11.38S13.02 11.38 14.27 11.04C14.96 10.86 15.5 10.35 15.68 9.66 16 8.4 16 5.77 16 5.77S16 3.14 15.68 1.88Z" fill="#0D1221"/>
        <path d="M6.4 8.23L10.55 5.77L6.4 3.31V8.23Z" fill="#C9A84C"/>
      </svg>
      Watch on YouTube
    </a>

    <div class="or">or</div>

    <a href="https://discord.gg/6fuPZFucKH" target="_blank" rel="noopener" class="btn btn-discord">
      <svg width="16" height="13" viewBox="0 0 24 18" fill="none">
        <path d="M20.32 1.54A19.73 19.73 0 0015.43 0c-.2.37-.44.87-.6 1.27a18.27 18.27 0 00-5.65 0A13.2 13.2 0 008.57 0 19.8 19.8 0 003.68 1.54C.53 6.35-.32 11.04.1 15.66a20.1 20.1 0 006.12 3.12 14.9 14.9 0 001.3-2.12 12.97 12.97 0 01-2.05-.99c.17-.13.34-.26.5-.4a14.28 14.28 0 0012.05 0c.17.14.33.27.5.4-.65.39-1.34.73-2.05.99.37.74.8 1.45 1.3 2.12a20.04 20.04 0 006.13-3.12c.5-5.26-.86-9.83-3.58-13.12zM8.02 12.82c-1.22 0-2.22-1.13-2.22-2.5s.98-2.5 2.22-2.5c1.23 0 2.24 1.12 2.22 2.5 0 1.37-.99 2.5-2.22 2.5zm7.96 0c-1.22 0-2.22-1.13-2.22-2.5s.98-2.5 2.22-2.5c1.23 0 2.24 1.12 2.22 2.5 0 1.37-.98 2.5-2.22 2.5z" fill="#C9A84C"/>
      </svg>
      Join the Discord
    </a>
  </div>



</div>

<div class="cursor" id="cursor"></div>
<script>
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
  document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
  document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; });
</script>
</body>
</html>
